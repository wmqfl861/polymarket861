name: Football regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints/research.txt
      - run: python -m pip install -c constraints/research.txt -e . ruff mypy
      - run: python scripts/check_league_boundaries.py
      - run: python scripts/check_recipe_references.py
      - run: ruff check src tests scripts
      - run: mypy --strict --follow-imports=silent src/polymarket861/{blob_storage,score_bounds,experiment_statistics}.py
      - run: |
          python -m pip install -c constraints/research.txt playwright
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as browsers:
              print("PM861_TEST_CHROMIUM=" + browsers.chromium.executable_path)
          PY
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_recipe_identity.py > recipe-${{ matrix.python }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-${{ matrix.python }}
          path: recipe-${{ matrix.python }}.json
  recipe-identity:
    runs-on: ubuntu-latest
    needs: unittest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -c constraints/research.txt -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: recipe-*
          merge-multiple: true
      - run: python scripts/check_recipe_identity.py --compare recipe-*.json
  systemd-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: constraints/research.txt
      - run: bash .github/scripts/verify-watch-deployment.sh
      - run: bash .github/scripts/verify-forecast-deployment.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: installed-wheel-and-service-checks
          path: |
            ${{ runner.temp }}/watch-dist/*.whl
            ${{ runner.temp }}/watch-*.json
            ${{ runner.temp }}/forecast-*.json
