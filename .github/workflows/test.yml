name: EPL regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: constraints/research.txt
      - run: python -m pip install -c constraints/research.txt -e . ruff mypy
      - run: ruff check src tests scripts
      - run: mypy --strict --follow-imports=silent src/polymarket861/blob_storage.py
      - if: matrix.python == '3.12'
        run: |
          python -m pip install -c constraints/research.txt playwright
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as browsers:
              print("PM861_TEST_CHROMIUM=" + browsers.chromium.executable_path)
          PY
      - run: python -m unittest discover -s tests -v
